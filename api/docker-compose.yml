version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: timerwallet
      POSTGRES_PASSWORD: timerwallet
      POSTGRES_DB: timerwallet
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - app
    ports:
      - "80:80"
    env_file: .env
    environment:
      - VITE_API_BASE=${VITE_API_BASE:-/api}
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    env_file: .env
    environment:
      POSTGRES_CONN: ${POSTGRES_CONN:-"host=db user=timerwallet password=timerwallet dbname=timerwallet sslmode=disable"}
      BOT_TOKEN: ${BOT_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    ports:
      - "8080:8080"
    command: ["/app/main"]
volumes:
  db_data:
